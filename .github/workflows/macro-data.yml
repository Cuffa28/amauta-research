name: Actualizar datos macro
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths: ['scripts/macro/**', '.github/workflows/macro-data.yml']
  schedule:
    # Días hábiles, 09:17, 13:17, 16:17 y 19:17 ART; sujeto a demora de Actions.
    - cron: '17 12,16,19,22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: macro-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar autenticación, identidad de series y conservación ante fallas
        run: python -B scripts/macro/test_collect.py
      - name: Consultar fuentes públicas y conservar última versión válida
        env:
          INDEC_API_TOKEN: ${{ secrets.INDEC_API_TOKEN }}
        run: python -B scripts/macro/collect.py
      - name: Versionar únicamente los datos públicos normalizados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/macro-lab/live
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(macro): actualizar observaciones oficiales'
          # Integrar cambios de código que hayan llegado durante la descarga.
          # Nunca usar force: si hay conflicto de datos, conservar el remoto y fallar.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}" || exit 1
            git rebase FETCH_HEAD || exit 1
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
